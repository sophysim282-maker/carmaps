name: CarMaps
options:
  bundleIdPrefix: com.sophysim282
  deploymentTarget:
    iOS: "16.0"
packages:
  GoogleMaps:
    url: https://github.com/googlemaps/ios-maps-sdk
    from: 9.0.0
settings:
  base:
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "2.8"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
targets:
  CarMaps:
    type: application
    platform: iOS
    sources: [App]
    dependencies:
      - package: GoogleMaps
        product: GoogleMaps
      - target: Tunnel
    scheme: {}
    entitlements:
      path: App/CarMaps.entitlements
      properties:
        com.apple.developer.networking.networkextension: [packet-tunnel-provider]
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Car Maps
        UILaunchScreen: {}
        NSLocationWhenInUseUsageDescription: Car Maps uses your location for navigation.
        NSLocalNetworkUsageDescription: Car Maps sends the map to your car over the hotspot Wi-Fi.
        NSMicrophoneUsageDescription: Car Maps uses the microphone for voice search.
        NSSpeechRecognitionUsageDescription: Car Maps turns your voice into a search.
        UIBackgroundModes: [location, audio]
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sophysim282.carmaps
        TARGETED_DEVICE_FAMILY: "1"
  Tunnel:
    type: app-extension
    platform: iOS
    sources: [Tunnel]
    entitlements:
      path: Tunnel/Tunnel.entitlements
      properties:
        com.apple.developer.networking.networkextension: [packet-tunnel-provider]
    info:
      path: Tunnel/Info.plist
      properties:
        CFBundleDisplayName: Car Maps Tunnel
        NSExtension:
          NSExtensionPointIdentifier: com.apple.networkextension.packet-tunnel
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PacketTunnelProvider
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sophysim282.carmaps.tunnel
        TARGETED_DEVICE_FAMILY: "1"
