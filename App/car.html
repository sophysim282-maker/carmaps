<!doctype html><html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Car Maps</title>
<style>
:root{--card:#fff;--text:#202124;--muted:#5f6368;--eta:#188038;--line:#e8eaed;--soft:#f1f3f4;--teal:#0b666e;--tealL:#d6eef0;--tealT:#0b666e}
.night{--card:#202124;--text:#e8eaed;--muted:#9aa0a6;--eta:#81c995;--line:#3c4043;--soft:#303134;--tealL:#1f3b3d;--tealT:#8fd3da}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#000;font-family:Roboto,-apple-system,"Segoe UI",sans-serif;overflow:hidden;color:var(--text);
 user-select:none;-webkit-user-select:none}
button{font:inherit;cursor:pointer}
#map{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;visibility:hidden;touch-action:none}
#msg{position:fixed;top:50%;width:100%;text-align:center;font-size:26px;color:#aaa;transform:translateY(-50%)}
.card{background:var(--card);color:var(--text);border-radius:22px;box-shadow:0 6px 24px rgba(0,0,0,.35)}
#panel{position:fixed;top:20px;left:20px;bottom:20px;width:440px;display:flex;flex-direction:column;gap:12px;pointer-events:none}
#panel>*{pointer-events:auto}
#searchBox{display:flex;align-items:center;gap:12px;padding:0 22px;height:66px;border-radius:33px;flex:none}
#searchBox .pin{font-size:24px}
#q{flex:1;border:0;outline:0;font-size:22px;background:transparent;color:var(--text);min-width:0}
#q::placeholder{color:var(--muted)}
.chips{display:flex;gap:8px;overflow-x:auto;flex:none;padding:2px}
.chip{flex:none;padding:11px 18px;border-radius:22px;background:var(--card);font-size:18px;box-shadow:0 2px 8px rgba(0,0,0,.25);border:0;color:var(--text)}
.box{overflow-y:auto;min-height:0}
.row{display:flex;gap:16px;align-items:center;padding:14px 22px;font-size:19px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .sub{font-size:15px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .ic{width:42px;height:42px;border-radius:21px;background:var(--soft);display:flex;align-items:center;justify-content:center;flex:none;font-size:20px}
.row .grow{flex:1;min-width:0}
.head{font-size:17px;font-weight:600;padding:14px 22px 4px;color:var(--muted)}
.sheet{padding:20px 22px;display:flex;flex-direction:column;gap:12px;overflow-y:auto;min-height:0}
.top{display:flex;align-items:flex-start;gap:10px}
h2{margin:0;font-size:28px;font-weight:600;flex:1}
.muted{color:var(--muted)}
.line{font-size:18px}
.stars{color:#f29900}
.btns{display:flex;gap:10px;flex-wrap:wrap}
.btn{border:0;border-radius:28px;padding:15px 24px;font-size:19px;font-weight:600;background:var(--tealL);color:var(--tealT)}
.btn.fill{background:var(--teal);color:#fff}
.btn.red{background:#d93025;color:#fff}
.x{border:0;width:46px;height:46px;border-radius:23px;background:var(--soft);font-size:20px;color:var(--text);flex:none}
.tabs{display:flex;gap:26px;border-bottom:1px solid var(--line)}
.tab{border:0;background:none;padding:8px 0 10px;font-size:19px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent}
.tab.on{color:var(--tealT);border-color:var(--tealT)}
.route{padding:12px 16px;border-left:5px solid transparent;border-radius:8px}
.route.on{border-color:var(--teal);background:var(--soft)}
.route .tt{font-size:25px;font-weight:700}
.route.best .tt{color:var(--eta)}
#turn{position:fixed;top:20px;left:20px;width:min(540px,44vw);background:#0d615a;color:#fff;border-radius:22px;
 padding:20px 24px;display:none;gap:20px;align-items:center;box-shadow:0 6px 24px rgba(0,0,0,.45)}
#turn svg{width:84px;height:84px;flex:none}
#dist{font-size:46px;font-weight:700;line-height:1.05}
#text{font-size:26px;font-weight:500;margin-top:4px;line-height:1.2}
#then{position:fixed;left:20px;background:#084a45;color:#fff;border-radius:16px;padding:10px 20px;
 font-size:24px;font-weight:600;display:none;align-items:center;gap:10px;box-shadow:0 6px 24px rgba(0,0,0,.4)}
#then svg{width:34px;height:34px}
#eta{position:fixed;bottom:20px;left:20px;display:none;align-items:center;gap:28px;padding:16px 18px 16px 28px}
#etaTime{font-size:38px;font-weight:700;color:var(--eta)}
#etaSub{font-size:20px;color:var(--muted)}
#wx{position:fixed;top:20px;right:20px;border-radius:16px;padding:10px 18px;font-size:22px;font-weight:600;display:none}
#tools{position:fixed;right:20px;bottom:20px;display:flex;flex-direction:column;gap:12px;align-items:flex-end}
.round{width:66px;height:66px;border-radius:33px;border:0;background:var(--card);color:var(--text);font-size:26px;
 box-shadow:0 4px 14px rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center}
.round.on{background:var(--teal);color:#fff}
#recenter{display:none;width:auto;padding:0 26px;font-size:21px;font-weight:600;color:var(--tealT)}
#status{position:fixed;top:20px;left:50%;transform:translateX(-50%);padding:10px 18px;border-radius:16px;font-size:18px;display:none}

svg.i{flex:none;vertical-align:middle}
.chip{display:flex;align-items:center;gap:8px;font-weight:500;padding:12px 20px}
.btn{display:inline-flex;align-items:center;gap:10px;padding:16px 26px;font-size:21px}
.row{font-size:21px;padding:16px 22px}
.row .sub{font-size:16px}
.row .ic{width:48px;height:48px;border-radius:24px;color:var(--muted)}
.x{display:flex;align-items:center;justify-content:center;width:50px;height:50px;border-radius:25px}
.tab{display:flex;align-items:center;gap:8px;font-size:21px}
#searchBox{height:72px;border-radius:36px}
#searchBox .pin{color:#d93025;display:flex}
#q{font-size:24px}
h2{font-size:30px}
.line{font-size:20px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.round{width:72px;height:72px;border-radius:36px}
#recenter{gap:10px}
#panel{width:470px}
#bgWrap{position:fixed;inset:0;overflow:hidden;display:none;background:#e8eaed;perspective:900px;pointer-events:none}
.night #bgWrap{background:#242f3e}
#bgWrap::after{content:"";position:absolute;left:0;right:0;top:0;height:42%;pointer-events:none;
 background:linear-gradient(#e8eaed 35%,rgba(232,234,237,0))}
.night #bgWrap::after{background:linear-gradient(#242f3e 35%,rgba(36,47,62,0))}
#bgImg{position:absolute;left:0;top:0;transition:left .45s linear,top .45s linear,transform .45s linear;will-change:transform}
#bgArrow{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);display:none;filter:drop-shadow(0 2px 4px rgba(0,0,0,.4));pointer-events:none}
#bgNote{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);padding:10px 18px;border-radius:16px;font-size:17px;display:none}
#side{position:fixed;top:100px;right:110px;width:440px;display:flex;flex-direction:column;gap:12px}
.dots{display:flex;flex-direction:column;align-items:center;gap:4px;padding:4px 0}
.dots i{display:block;width:4px;height:4px;border-radius:2px;background:var(--muted)}
.trip{display:flex;gap:14px;align-items:stretch}
.trip .col{display:flex;flex-direction:column;align-items:center;padding-top:14px}
.trip .names{flex:1;min-width:0}
.trip .nm{height:46px;display:flex;align-items:center;gap:8px;font-size:20px;border-bottom:1px solid var(--line)}
.trip .nm:last-child{border-bottom:0}
.trip .nm span{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tabs{overflow-x:auto;gap:20px}
.tab{white-space:nowrap;flex:none}
</style></head><body>
<img id="map" alt="" draggable="false">
<div id="msg">Open Car Maps on your iPhone…</div>
<div id="bgWrap"><img id="bgImg" alt=""></div>
<div id="bgArrow"></div>
<div id="bgNote" class="card">iPhone locked · simple map</div>
<div id="panel"></div>
<div id="side"></div>
<div id="turn"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"
 stroke-linejoin="round"><g id="icon"></g></svg><div><div id="dist"></div><div id="text"></div></div></div>
<div id="then">Then <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"
 stroke-linejoin="round"><g id="thenIcon"></g></svg></div>
<div id="eta" class="card"><div><div id="etaTime"></div><div id="etaSub"></div></div>
 <button class="btn red" data-a="exit">Exit</button></div>
<div id="wx" class="card"></div>
<div id="status" class="card"></div>
<div id="tools">
 <button class="round" id="recenter" data-a="recenter"></button>
 <button class="round" id="compass" data-a="compass" title="Compass"></button>
 <button class="round" id="navsearch" title="Search along the way"></button>
 <button class="round" id="overview" data-a="overview" title="Route overview"></button>
 <button class="round" data-a="layer" id="layer" title="Satellite"></button>
 <button class="round" id="carVoice" title="Voice on car speakers"></button>
 <button class="round" data-a="zoom" data-d="1" id="zin"></button>
 <button class="round" data-a="zoom" data-d="-1" id="zout"></button>
 <button class="round" id="fs" title="Full screen"></button>
</div>
<script>
const $=id=>document.getElementById(id), map=$('map');
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const L='<path d="M16 21v-8a4 4 0 0 0-4-4H5"/><path d="M9 5L5 9l4 4"/>';
const R='<g transform="translate(24 0) scale(-1 1)">'+L+'</g>';
const SL='<path d="M15 21v-7L7 6"/><path d="M7 12V6h6"/>';
const SR='<g transform="translate(24 0) scale(-1 1)">'+SL+'</g>';
const UT='<path d="M15 21V9a4 4 0 0 0-8 0v6"/><path d="M4 12l3 3 3-3"/>';
const ST='<path d="M12 21V4"/><path d="M6 10l6-6 6 6"/>';
const RB='<circle cx="12" cy="9" r="4"/><path d="M12 21v-8"/><path d="M16 9h4"/><path d="M18 7l2 2-2 2"/>';
const AR='<path d="M6 21V4"/><path d="M6 4h11l-2.5 4L17 12H6"/>';
const ICON={TURN_LEFT:L,TURN_SHARP_LEFT:L,TURN_RIGHT:R,TURN_SHARP_RIGHT:R,TURN_SLIGHT_LEFT:SL,RAMP_LEFT:SL,FORK_LEFT:SL,
 TURN_SLIGHT_RIGHT:SR,RAMP_RIGHT:SR,FORK_RIGHT:SR,UTURN_LEFT:UT,UTURN_RIGHT:UT,ROUNDABOUT_LEFT:RB,ROUNDABOUT_RIGHT:RB,
 ROUNDABOUT_CLOCKWISE:RB,ROUNDABOUT_COUNTERCLOCKWISE:RB,ARRIVE:AR};
const IC={
 search:'<circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/>',
 pin:'<path d="M12 21s-6.5-6.2-6.5-11a6.5 6.5 0 0 1 13 0c0 4.8-6.5 11-6.5 11z"/><circle cx="12" cy="10" r="2.4"/>',
 home:'<path d="M4 11l8-7 8 7"/><path d="M6 9.5V20h12V9.5"/><path d="M10 20v-5h4v5"/>',
 work:'<rect x="3.5" y="7.5" width="17" height="12" rx="2"/><path d="M9 7.5V5.5a1.5 1.5 0 0 1 1.5-1.5h3A1.5 1.5 0 0 1 15 5.5v2"/><path d="M3.5 12.5h17"/>',
 star:'<path d="M12 4l2.5 5.2 5.6.7-4.1 3.9 1 5.6L12 16.7 7 19.4l1-5.6-4.1-3.9 5.6-.7z"/>',
 clock:'<circle cx="12" cy="12" r="8"/><path d="M12 7.5V12l3 2"/>',
 close:'<path d="M6 6l12 12M18 6L6 18"/>',
 back:'<path d="M19 12H5"/><path d="M11 6l-6 6 6 6"/>',
 dir:'<path d="M12 2.8l9.2 9.2-9.2 9.2L2.8 12z"/><path d="M9 14v-2.5a1.5 1.5 0 0 1 1.5-1.5H15"/><path d="M13 8l2 2-2 2"/>',
 nav:'<path d="M12 3l7 17-7-4-7 4z"/>',
 car:'<path d="M5 16v2.5M19 16v2.5"/><path d="M4 16h16v-4l-2-5H6l-2 5z"/><path d="M4 12h16"/><circle cx="7.5" cy="14" r=".6"/><circle cx="16.5" cy="14" r=".6"/>',
 moto:'<circle cx="6" cy="16.5" r="3"/><circle cx="18" cy="16.5" r="3"/><path d="M6 16.5l4-6h4l4 6"/><path d="M14 10.5l-1.5-4H10"/>',
 walk:'<circle cx="13" cy="4.5" r="1.8"/><path d="M10 21l2-6 2.5 2.5V21"/><path d="M8 11l3-3.5 3 1.5 1.5 3 2.5 1"/><path d="M12 15l-.5-6"/>',
 layers:'<path d="M12 4l9 5-9 5-9-5z"/><path d="M3 14l9 5 9-5"/>',
 plus:'<path d="M12 5v14M5 12h14"/>',
 minus:'<path d="M5 12h14"/>',
 full:'<path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/>',
 volOn:'<path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/>',
 volOff:'<path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="M16 9.5l5 5M21 9.5l-5 5"/>',
 locate:'<circle cx="12" cy="12" r="6.5"/><circle cx="12" cy="12" r="2.2"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3"/>',
 route:'<circle cx="6" cy="18" r="2"/><circle cx="18" cy="6" r="2"/><path d="M8 18h7.5a3.5 3.5 0 0 0 0-7h-7a3.5 3.5 0 0 1 0-7H16"/>',
 food:'<path d="M7 3v8M5 3v5a2 2 0 0 0 4 0V3M7 11v10"/><path d="M17 21V3c-2 1.5-3 4-3 7v3h3"/>',
 coffee:'<path d="M4 9h12v5a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5z"/><path d="M16 10.5h1.5a2.5 2.5 0 0 1 0 5H16"/><path d="M8 3v3M12 3v3"/>',
 gas:'<rect x="4" y="4" width="9" height="16" rx="1.5"/><path d="M4 10h9"/><path d="M13 8l3.5 2.5V17a1.5 1.5 0 0 0 3 0V8l-2-2"/>',
 bolt:'<path d="M13 3L5 13.5h6L10 21l8-10.5h-6z"/>',
 bed:'<path d="M3 19V6M3 15h18v4"/><path d="M21 15v-3a3 3 0 0 0-3-3h-7v6"/><circle cx="7" cy="11.5" r="1.8"/>',
 train:'<rect x="5" y="3" width="14" height="14" rx="3"/><path d="M5 11h14"/><circle cx="8.5" cy="14" r=".8"/><circle cx="15.5" cy="14" r=".8"/><path d="M8 21l2-4M16 21l-2-4"/>',
 cart:'<path d="M3 4h2.5l2.2 10.5h10.5L20.5 7H7"/><circle cx="9" cy="19" r="1.5"/><circle cx="17" cy="19" r="1.5"/>',
};
function svg(n,size){ return '<svg class="i" width="'+(size||24)+'" height="'+(size||24)+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'+(IC[n]||'')+'</svg>'; }
const CATS=[['food','Restaurants','restaurants'],['coffee','Coffee','coffee'],['gas','Gas','gas station'],['bolt','Charging','EV charging station'],
 ['bed','Hotels','hotels'],['cart','Groceries','supermarket']];
const MODES=[['DRIVE','car'],['TWO_WHEELER','moto'],['TRANSIT','train'],['WALK','walk']];
const NEAR=[['gas','Gas','gas station'],['bolt','Charging','EV charging station'],['coffee','Coffee','coffee'],['food','Restaurants','restaurants'],['cart','Groceries','supermarket']];

/* ---------- icons on the round buttons ---------- */
$('recenter').innerHTML=svg('nav',26)+'<span>Re-centre</span>';
$('compass').innerHTML='<svg width="36" height="36" viewBox="0 0 24 24"><g id="needle"><path d="M12 2.5l3.6 9.5H8.4z" fill="#d93025"/><path d="M12 21.5l3.6-9.5H8.4z" fill="#b0b0b0"/></g></svg>';
$('navsearch').innerHTML=svg('search',30);
let nearOpen=false;
$('navsearch').onclick=()=>{ nearOpen=!nearOpen; lastSig=''; renderPanel(); }; $('overview').innerHTML=svg('route',30);
$('layer').innerHTML=svg('layers',30); $('carVoice').innerHTML=svg('volOff',30); $('zin').innerHTML=svg('plus',30);
$('zout').innerHTML=svg('minus',30); $('fs').innerHTML=svg('full',28);
document.querySelector('#eta .btn').innerHTML='Exit';

/* ---------- live map pictures ---------- */
function connect(){ map.src='/stream?t='+Date.now(); }
map.onload=()=>{$('msg').style.display='none';map.style.visibility='visible'};
map.onerror=()=>{$('msg').style.display='block'; setTimeout(connect,1500)};
connect();

/* ---------- send a command to the iPhone ---------- */
function cmd(a,params){
  const p=new URLSearchParams(params||{}); p.set('a',a);
  fetch('/cmd?'+p.toString()).then(()=>setTimeout(poll,150)).catch(()=>{});
}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]'); if(!b) return;
  const d=Object.assign({},b.dataset); const a=d.a; delete d.a; cmd(a,d);
});

/* ---------- drag the map, long-press for a pin ---------- */
let drag=null,pressT=null;
function scale(){ const w=map.naturalWidth||1280,h=map.naturalHeight||800; return {w,h,s:Math.max(innerWidth/w,innerHeight/h)}; }
function frac(x,y){ const k=scale(); return {x:((x-(innerWidth-k.w*k.s)/2)/k.s/k.w).toFixed(4), y:((y-(innerHeight-k.h*k.s)/2)/k.s/k.h).toFixed(4)}; }
map.addEventListener('pointerdown',e=>{
  drag={x:e.clientX,y:e.clientY,dx:0,dy:0}; try{map.setPointerCapture(e.pointerId)}catch(_){}
  clearTimeout(pressT);
  pressT=setTimeout(()=>{ if(drag&&Math.abs(drag.dx)+Math.abs(drag.dy)<12){ cmd('pin',frac(drag.x,drag.y)); drag=null; } },700);
});
map.addEventListener('pointermove',e=>{
  if(!drag) return; drag.dx=e.clientX-drag.x; drag.dy=e.clientY-drag.y;
  map.style.transform='translate('+drag.dx+'px,'+drag.dy+'px)';
});
function endDrag(){
  clearTimeout(pressT);
  if(drag&&Math.abs(drag.dx)+Math.abs(drag.dy)>=12){
    const k=scale(); cmd('pan',{x:(drag.dx/k.s/k.w).toFixed(4),y:(drag.dy/k.s/k.h).toFixed(4)});
  }
  drag=null; setTimeout(()=>{map.style.transform=''},350);
}
map.addEventListener('pointerup',endDrag); map.addEventListener('pointercancel',endDrag);

/* ---------- side panel (search, results, place, directions) ---------- */
let S={}, lastSig='', typed='', typeT=null, stopMode=false;
function row(ic,title,sub,attrs){ return '<div class="row" '+attrs+'><div class="ic">'+svg(ic,24)+'</div><div class="grow"><div class="t">'+esc(title)+
  '</div>'+(sub?'<div class="sub">'+esc(sub)+'</div>':'')+'</div></div>'; }
function searchBox(){
  return '<div id="searchBox" class="card"><span class="pin">'+svg('pin',30)+'</span><input id="q" placeholder="'+(stopMode?'Add stop':'Search here')+'" autocomplete="off" value="'+esc(typed)+'">'+
   (typed?'<button class="x" id="qx">'+svg('close',22)+'</button>':'')+'</div>';
}
function homeHTML(){
  let h=searchBox();
  if(typed){
    h+='<div class="card box">'+row('search','Search “'+typed+'”','','data-a="search" data-q="'+esc(typed)+'"');
    (S.suggestions||[]).forEach(s=>{ h+=row('pin',s.main,s.secondary,'data-a="suggest" data-id="'+esc(s.id)+'"'); });
    return h+'</div>';
  }
  h+='<div class="chips">'+CATS.map(c=>'<button class="chip" data-a="search" data-q="'+c[2]+'">'+svg(c[0],22)+'<span>'+c[1]+'</span></button>').join('')+'</div>';
  h+='<div class="card box">';
  h+=row('home','Home',S.home||'Set it on the iPhone: Save → Home',S.home?'data-a="home"':'');
  h+=row('work','Work',S.work||'Set it on the iPhone: Save → Work',S.work?'data-a="work"':'');
  (S.favorites||[]).forEach((f,i)=>{ h+=row('star',f.name,'','data-a="fav" data-i="'+i+'"'); });
  if((S.recents||[]).length){
    h+='<div class="head">Recent</div>';
    S.recents.forEach((r,i)=>{ h+=row('clock',r.name,r.address,'data-a="recent" data-i="'+i+'"'); });
  }
  return h+'</div>';
}
function stopHTML(){
  let h=searchBox()+'<div class="card box"><div class="sheet" style="padding-bottom:4px"><div class="top"><h2>Add stop</h2>'+
    '<button class="x" id="stopCancel">'+svg('close',22)+'</button></div></div>';
  if(!typed) h+='<div class="row"><div class="grow muted">Type a place name with the keyboard</div></div>';
  (S.suggestions||[]).forEach(s=>{ if(typed) h+=row('pin',s.main,s.secondary,'data-a="stopsuggest" data-id="'+esc(s.id)+'"'); });
  return h+'</div>';
}
function resultsHTML(){
  let h=searchBox()+'<div class="card box"><div class="sheet" style="padding-bottom:4px"><div class="top"><h2>Results</h2>'+
    '<button class="x" data-a="close">'+svg('close',22)+'</button></div></div>';
  (S.results||[]).forEach((r,i)=>{ h+=row('pin',r.name,r.address,'data-a="result" data-i="'+i+'"'); });
  return h+'</div>';
}
function stars(r){ let s=''; for(let i=0;i<5;i++) s+= r-i>=0.75?'★':(r-i>=0.25?'⯪':'☆'); return s; }
function placeHTML(){
  const p=S.place||{};
  let h='<div class="card sheet"><div class="top"><h2>'+esc(p.name)+'</h2><button class="x" data-a="close">'+svg('close',22)+'</button></div>';
  let l1=[];
  if(p.rating) l1.push(p.rating.toFixed(1)+' <span class="stars">'+stars(p.rating)+'</span> <span class="muted">('+p.count+')</span>');
  if(p.drive) l1.push(svg('car',20)+' '+esc(p.drive));
  if(l1.length) h+='<div class="line">'+l1.join(' · ')+'</div>';
  if(p.type) h+='<div class="line muted">'+esc(p.type)+'</div>';
  if(p.open!==undefined) h+='<div class="line"><span style="color:'+(p.open?'var(--eta)':'#d93025')+'">'+(p.open?'Open':'Closed')+'</span>'+
     (p.hours?' <span class="muted">· '+esc(p.hours)+'</span>':'')+'</div>';
  h+='<div class="line muted">'+esc(p.address)+'</div>';
  h+='<div class="btns"><button class="btn fill" data-a="directions">'+svg('dir',24)+'Directions</button><button class="btn" data-a="start">'+svg('nav',22)+'Start</button></div>';
  return h+'</div>';
}
function directionsHTML(){
  const p=S.place||{}, m=S.mode||'DRIVE';
  const title={DRIVE:'Drive',TWO_WHEELER:'Motorbike',TRANSIT:'Transit',WALK:'Walk'}[m]||'Drive';
  let h='<div class="card sheet"><div class="top"><button class="x" data-a="back">'+svg('back',22)+'</button><h2>'+title+'</h2><button class="x" data-a="close">'+svg('close',22)+'</button></div>';
  const dots='<div class="dots"><i></i><i></i><i></i><i></i></div>';
  h+='<div class="trip"><div class="col"><span style="width:14px;height:14px;border-radius:7px;background:#1a73e8;border:2px solid #fff;box-shadow:0 0 2px rgba(0,0,0,.5)"></span>'+dots+
    (S.stop?'<span style="width:12px;height:12px;border-radius:6px;border:2px solid var(--muted)"></span>'+dots:'')+
    '<span style="color:#d93025;display:flex">'+svg('pin',20)+'</span></div><div class="names">'+
    '<div class="nm"><span style="color:#1a73e8">Your location</span></div>'+
    (S.stop?'<div class="nm"><span>'+esc(S.stop)+'</span><button class="x" style="width:38px;height:38px" data-a="removestop">'+svg('close',18)+'</button></div>':'')+
    '<div class="nm"><span>'+esc(p.name)+'</span></div></div></div>';
  h+='<div class="tabs">'+MODES.map(x=>'<button class="tab'+(x[0]===m?' on':'')+'" data-a="mode" data-m="'+x[0]+'">'+svg(x[1],26)+' '+
     esc((S.modes||{})[x[0]]||'…')+'</button>').join('')+'</div>';
  const rs=S.routes||[];
  if(!rs.length) h+='<div class="line muted">'+esc(S.status||'Finding routes…')+'</div>';
  rs.forEach((r,i)=>{ h+='<div class="route'+(r.sel?' on':'')+(i===0?' best':'')+'" data-a="route" data-i="'+i+'"><div class="tt">'+esc(r.time)+
     '</div><div class="muted">Arrive '+esc(r.arrive)+(i===0?' · Best route':'')+' · '+esc(r.dist)+'</div></div>'; });
  h+='<div class="btns"><button class="btn fill" data-a="start">'+svg('nav',22)+'Start</button>'+
     '<button class="btn" id="addStop">'+svg('pin',22)+'Add stops</button></div>';
  return h+'</div>';
}
function sideHTML(){
  let h='';
  if(nearOpen) h+='<div class="card sheet"><div class="top"><h2>Search along the way</h2><button class="x" id="nearClose">'+svg('close',22)+
     '</button></div><div class="chips" style="flex-wrap:wrap">'+NEAR.map(c=>'<button class="chip" data-a="navsearch" data-q="'+c[2]+'">'+
     svg(c[0],22)+'<span>'+c[1]+'</span></button>').join('')+'</div></div>';
  const r=S.driveResults||[];
  if(r.length){
    h+='<div class="card box"><div class="sheet" style="padding-bottom:4px"><div class="top"><h2>Nearby</h2><button class="x" data-a="clearnear">'+
       svg('close',22)+'</button></div></div>';
    r.forEach((x,i)=>{ h+=row('pin',x.name,x.address,'data-a="go" data-i="'+i+'"'); });
    h+='</div>';
  }
  return h;
}
function renderPanel(){
  const scr=S.screen||'home';
  const sig=JSON.stringify([scr,S.place,S.routes,S.mode,S.modes,S.results,S.home,S.work,S.favorites,S.recents,S.status,
     typed?S.suggestions:0, typed?1:0, S.stop, stopMode, nearOpen, S.driveResults]);
  if(sig===lastSig) return; lastSig=sig;
  const panel=$('panel'); const hadFocus=document.activeElement&&document.activeElement.id==='q';
  $('side').innerHTML= scr==='drive'?sideHTML():'';
  if(scr!=='drive') nearOpen=false;
  if(scr!=='directions') stopMode=false;
  if(scr==='drive'){ panel.innerHTML=''; return; }
  panel.innerHTML= stopMode?stopHTML(): scr==='results'?resultsHTML(): scr==='place'?placeHTML(): scr==='directions'?directionsHTML(): homeHTML();
  const as=$('addStop'); if(as) as.onclick=()=>{ stopMode=true; typed=''; lastSig=''; renderPanel(); const q=$('q'); if(q) q.focus(); };
  const sc=$('stopCancel'); if(sc) sc.onclick=()=>{ stopMode=false; typed=''; lastSig=''; renderPanel(); };
  const q=$('q');
  if(q){
    if(hadFocus){ q.focus(); q.setSelectionRange(q.value.length,q.value.length); }
    q.addEventListener('input',()=>{ typed=q.value; clearTimeout(typeT); typeT=setTimeout(()=>{ cmd('type',{q:typed}); },300);
      if(!typed||typed.length===1){ lastSig=''; renderPanel(); } });
    q.addEventListener('keydown',e=>{ if(e.key==='Enter'&&typed.trim()&&!stopMode){ cmd('search',{q:typed}); typed=''; q.blur(); } });
  }
  const qx=$('qx'); if(qx) qx.onclick=()=>{ typed=''; lastSig=''; renderPanel(); };
}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-a="search"],[data-a="suggest"],[data-a="stopsuggest"]'); if(b){ typed=''; stopMode=false; }
  if(e.target.closest('[data-a="navsearch"]')) nearOpen=false;
  if(e.target.closest('#nearClose')){ nearOpen=false; lastSig=''; renderPanel(); }
});

/* ---------- voice on car speakers ---------- */
let carVoice=false,lastSpoken=-1,lang='en';
function speak(t){ if(!window.speechSynthesis) return; const u=new SpeechSynthesisUtterance(t); u.lang=lang; speechSynthesis.speak(u); }
$('carVoice').onclick=()=>{ carVoice=!carVoice; $('carVoice').innerHTML=svg(carVoice?'volOn':'volOff',30); $('carVoice').classList.toggle('on',carVoice); if(carVoice) speak('OK'); };
$('fs').onclick=()=>{const d=document.documentElement;(d.requestFullscreen||d.webkitRequestFullscreen||function(){}).call(d)};

/* ---------- iPhone locked: move / turn / tilt one big map picture with the GPS ---------- */
const BG={id:-1,pending:-1,lat:0,lng:0,z:16}; let hCont=null;
function world(lat,lng,z){ const s=512*Math.pow(2,z); const si=Math.sin(lat*Math.PI/180);
  return [(lng+180)/360*s, (0.5-Math.log((1+si)/(1-si))/(4*Math.PI))*s]; }
function updateBg(){
  const wrap=$('bgWrap');
  if(!S.bg){ wrap.style.display='none'; $('bgArrow').style.display='none'; return; }
  wrap.style.display='block';
  if(S.bgId!==undefined && S.bgId!==BG.id && S.bgId!==BG.pending){
    BG.pending=S.bgId; const meta={id:S.bgId,lat:S.bgLat,lng:S.bgLng,z:S.bgZoom};
    const im=new Image();
    im.onload=()=>{ const img=$('bgImg'); img.style.transition='none'; img.src=im.src; Object.assign(BG,meta); place();
      void img.offsetWidth; img.style.transition=''; };
    im.src='/bgmap?id='+S.bgId;
  }
  place();
}
const CAR_SVG='<svg width="46" height="80" viewBox="0 0 46 80"><rect x="7" y="4" width="32" height="72" rx="13" fill="#fff" stroke="#b8b8b8"/>'+
 '<rect x="2" y="25" width="7" height="5" rx="2" fill="#ccc"/><rect x="37" y="25" width="7" height="5" rx="2" fill="#ccc"/>'+
 '<path d="M10 31Q23 19 36 31L32.5 40H13.5Z" fill="#214a94"/><rect x="13" y="40" width="20" height="20" rx="4" fill="#f0f0f0"/>'+
 '<path d="M13.5 60H32.5L34.5 67Q23 71 11.5 67Z" fill="#214a94"/><ellipse cx="14" cy="8" rx="4" ry="2" fill="#fff5bf"/>'+
 '<ellipse cx="32" cy="8" rx="4" ry="2" fill="#fff5bf"/><rect x="10" y="71" width="8" height="3" rx="1.5" fill="#e01f1f"/>'+
 '<rect x="28" y="71" width="8" height="3" rx="1.5" fill="#e01f1f"/></svg>';
const ARROW_SVG='<svg width="64" height="64" viewBox="0 0 48 48"><path d="M24 4L41 42L24 33L7 42Z" fill="#1a73e8" stroke="#fff" stroke-width="4" stroke-linejoin="round"/></svg>';
let iconShown='';
function place(){
  if(BG.id<0||!S.lat) return;
  const img=$('bgImg'), arrow=$('bgArrow'), drive=S.screen==='drive', k=drive?2.2:1.5;
  const c=world(S.lat,S.lng,BG.z), o=world(BG.lat,BG.lng,BG.z);
  const px=640+(c[0]-o[0]), py=640+(c[1]-o[1]);
  const ax=innerWidth/2, ay=drive?innerHeight*0.74:innerHeight/2;
  let h=S.heading||0;
  if(hCont===null) hCont=h; else hCont+=((h-(hCont%360)+540)%360)-180;
  img.style.width=1280*k+'px'; img.style.height=1280*k+'px';
  img.style.left=(ax-px*k)+'px'; img.style.top=(ay-py*k)+'px';
  img.style.transformOrigin=(px*k)+'px '+(py*k)+'px';
  img.style.transform=drive?'rotateX(62deg) rotate('+(-hCont)+'deg)':'none';
  $('bgWrap').style.perspectiveOrigin=ax+'px '+ay+'px';
  arrow.style.display='block'; arrow.style.left=ax+'px'; arrow.style.top=ay+'px';
  const want=S.carIcon==='arrow'?'arrow':'car';
  if(iconShown!==want){ iconShown=want; arrow.innerHTML=want==='car'?CAR_SVG:ARROW_SVG; }
  arrow.firstElementChild.style.transform=drive?'scale(1.5,1.15)':'rotate('+h+'deg) scale(1.2)';
}

/* ---------- poll the iPhone ---------- */
let pollT=null;
async function poll(){
  clearTimeout(pollT);
  try{
    S=await (await fetch('/state?t='+Date.now())).json();
    document.body.classList.toggle('night',!!S.night);
    lang=S.lang||'en';
    const on=S.screen==='drive';
    $('turn').style.display=on?'flex':'none'; $('eta').style.display=on?'flex':'none';
    $('overview').style.display=on?'flex':'none';
    $('compass').style.display=on?'flex':'none'; $('navsearch').style.display=on?'flex':'none';
    const ng=$('needle'); if(ng) ng.setAttribute('transform','rotate('+(S.headingUp?-(S.heading||0):0)+' 12 12)');
    $('recenter').style.display=(on&&S.follow===false)?'flex':'none';
    if(on){
      $('icon').innerHTML=ICON[S.maneuver]||ST; $('dist').textContent=S.distance; $('text').textContent=S.instruction;
      $('etaTime').textContent=S.eta; $('etaSub').textContent=S.remaining+' · '+S.arrival;
      $('then').style.top=($('turn').getBoundingClientRect().bottom+8)+'px';
    }
    $('then').style.display=(on&&S.then)?'flex':'none';
    if(S.then) $('thenIcon').innerHTML=ICON[S.then]||ST;
    $('wx').style.display=S.weather?'block':'none'; $('wx').textContent='☀ '+(S.weather||'');
    $('layer').classList.toggle('on',S.mapType==='satellite');
    $('bgNote').style.display=(S.bg&&!on)?'block':'none';
    updateBg();
    $('status').style.display=(S.status&&S.screen!=='directions')?'block':'none'; $('status').textContent=S.status||'';
    renderPanel();
    if(lastSpoken<0) lastSpoken=S.spokenId;
    if(carVoice && S.spokenId!==lastSpoken) speak(S.spokenText);
    lastSpoken=S.spokenId;
  }catch(e){}
  pollT=setTimeout(poll,(S.bg||S.screen==='drive')?300:600);
}
poll();
</script></body></html>
