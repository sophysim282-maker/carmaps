name: Build CarVideo IPA

on:
  push:
    branches: [carvideo-ipa]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install tools
        run: brew install xcodegen ldid

      - name: Make Xcode project
        run: xcodegen generate

      - name: Build app (unsigned)
        run: |
          set -o pipefail
          xcodebuild -project CarVideo.xcodeproj -target CarVideo \
            -configuration Release -sdk iphoneos \
            SYMROOT="$PWD/build" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            2>&1 | tee build.log

      - name: Package IPA
        run: |
          mkdir -p Payload output
          cp -R build/Release-iphoneos/CarVideo.app Payload/
          # Put the CarPlay entitlement into the app (TrollStore keeps it; Sideloadly/AltStore re-sign)
          ldid -SCarVideo/CarVideo.entitlements Payload/CarVideo.app/CarVideo
          zip -qr output/CarVideo.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: CarVideo-ipa
          path: output/CarVideo.ipa

      - name: Save IPA (or error log) back to this branch
        if: always()
        run: |
          mkdir -p output
          grep -E "error:|BUILD (SUCCEEDED|FAILED)" build.log > output/build-errors.txt 2>/dev/null || true
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -f output
          git commit -m "Build result [skip ci]" || exit 0
          git push
