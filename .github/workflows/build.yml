name: Build IPA
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Make Xcode project
        run: xcodegen generate
      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild -project CarMaps.xcodeproj -scheme CarMaps -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build | tail -n 200
      - name: Make IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/CarMaps.app Payload/
          zip -qry CarMaps.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: CarMaps-ipa
          path: CarMaps.ipa
